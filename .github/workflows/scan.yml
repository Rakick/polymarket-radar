name: Scan horaire Polymarket
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 22 provides the native WebSocket implementation required by Supabase Realtime.
          node-version: 22
      # The repository currently has no committed lockfile. Generate one before
      # npm ci so the workflow does not fail immediately on a clean checkout.
      - run: npm install --package-lock-only
      - run: npm ci
      - name: Run hourly scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scan
